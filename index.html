<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App de Inventario</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f4f9; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .seccion { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219150; }
        .btn-camara { background-color: #2980b9; margin-bottom: 10px; }
        .btn-borrar { background-color: #c0392b; width: auto; padding: 5px 10px; margin: 0; }
        .camara-box { background-color: #e8f8f5; border: 2px dashed #2ecc71; text-align: center; }
        #lector-camara { width: 100%; max-width: 400px; margin: 10px auto; display: none; background: #000; border-radius: 8px; overflow: hidden; }
        ul { list-style-type: none; padding: 0; }
        li { background: #fdfefe; padding: 12px; margin-bottom: 6px; border-radius: 4px; border-left: 5px solid #2980b9; display: flex; justify-content: space-between; align-items: center; }
        .historial-item { border-left: 5px solid #f39c12; }
    </style>
</head>
<body>

    <h1>📦 Mi Negocio</h1>

    <!-- 1. ESCÁNER CON CÁMARA Y AUDIO -->
    <div class="seccion camara-box">
        <h2>🛒 Escanear con Celular</h2>
        <button class="btn-camara" id="btn-encender">📷 Encender Cámara para Vender</button>
        <div id="lector-camara"></div>
        <input type="text" id="codigo-manual" placeholder="O escribe el código a mano...">
    </div>

    <!-- 2. AGREGAR PRODUCTOS -->
    <div class="seccion">
        <h2>➕ Agregar al Catálogo</h2>
        <form id="form-producto">
            <input type="text" id="prod-codigo" placeholder="Código de barra" required>
            <input type="text" id="prod-nombre" placeholder="Nombre del producto" required>
            <input type="number" id="prod-precio" placeholder="Precio ($)" step="0.01" required>
            <input type="number" id="prod-stock" placeholder="Cantidad disponible (Stock)" required>
            <button type="submit">Guardar en Inventario</button>
        </form>
    </div>

    <!-- 3. INVENTARIO -->
    <div class="seccion">
        <h2>📋 Inventario Actual</h2>
        <input type="text" id="buscador" placeholder="🔍 Buscar por nombre o código...">
        <ul id="lista-productos"></ul>
    </div>

    <!-- 4. HISTORIAL -->
    <div class="seccion">
        <h2>📜 Historial de Ventas</h2>
        <ul id="lista-historial"></ul>
    </div>

    <!-- AUDIO DE BIP USANDO UN EFECTO INCORPORADO -->
    <audio id="audio-bip" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>

    <script>
        let productos = JSON.parse(localStorage.getItem('pos_productos')) || [];
        let historial = JSON.parse(localStorage.getItem('pos_historial')) || [];

        const listaProd = document.getElementById('lista-productos');
        const listaHist = document.getElementById('lista-historial');
        const buscador = document.getElementById('buscador');
        const inputManual = document.getElementById('codigo-manual');
        const divLector = document.getElementById('lector-camara');
        const btnEncender = document.getElementById('btn-encender');
        const audioBip = document.getElementById('audio-bip');

        let html5QrcodeScanner = null;
        let ultimoEscaneo = "";

        function reproducirBip() {
            audioBip.currentTime = 0;
            audioBip.play().catch(e => {});
        }

        function actualizarPantalla() {
            listaProd.innerHTML = '';
            const filtro = buscador.value.toLowerCase();
            productos.forEach((p, index) => {
                if (p.nombre.toLowerCase().includes(filtro) || p.codigo.includes(filtro)) {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <strong>${p.nombre}</strong> <small>(${p.codigo})</small><br>
                            Precio: $${p.precio} | 📦 Stock: <b>${p.stock}</b>
                        </div>
                        <button class="btn-borrar" onclick="eliminarProducto(${index})">Eliminar</button>
                    `;
                    listaProd.appendChild(li);
                }
            });

            listaHist.innerHTML = '';
            historial.slice().reverse().forEach(v => {
                const li = document.createElement('li');
                li.className = 'historial-item';
                li.innerHTML = `<span>🕒 ${v.fecha} - <b>${v.nombre}</b> vendido por $${v.precio}</span>`;
                listaHist.appendChild(li);
            });
        }

        function procesarVenta(codigoEscaneado) {
            reproducirBip(); // Suena el bip al instante
            const producto = productos.find(p => p.codigo === codigoEscaneado);

            if (producto) {
                if (producto.stock > 0) {
                    producto.stock -= 1;
                    const ahora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    historial.push({ nombre: producto.nombre, precio: producto.precio, fecha: ahora });
                    localStorage.setItem('pos_productos', JSON.stringify(productos));
                    localStorage.setItem('pos_historial', JSON.stringify(historial));
                    alert(`¡Vendido! ${producto.nombre}. Stock restante: ${producto.stock}`);
                } else {
                    alert(`⚠️ ¡Sin Stock de: ${producto.nombre}`);
                }
            } else {
                alert(`❌ Código (${codigoEscaneado}) no registrado.`);
            }
            actualizarPantalla();
        }

        btnEncender.addEventListener('click', () => {
            if (divLector.style.display === 'none' || divLector.style.display === '') {
                divLector.style.display = 'block';
                btnEncender.textContent = "🛑 Apagar Cámara";
                html5QrcodeScanner = new Html5Qrcode("lector-camara");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        if (decodedText.trim() !== ultimoEscaneo) {
                            ultimoEscaneo = decodedText.trim();
                            procesarVenta(ultimoEscaneo);
                            setTimeout(() => { ultimoEscaneo = ""; }, 2500); // Evita lecturas dobles seguidas
                        }
                    },
                    (err) => {}
                ).catch(err => { alert("No se pudo activar la cámara."); });
            } else {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        divLector.style.display = 'none';
                        btnEncender.textContent = "📷 Encender Cámara para Vender";
                    });
                }
            }
        });

        document.getElementById('form-producto').addEventListener('submit', (e) => {
            e.preventDefault();
            productos.push({
                codigo: document.getElementById('prod-codigo').value.trim(),
                nombre: document.getElementById('prod-nombre').value,
                precio: document.getElementById('prod-precio').value,
                stock: parseInt(document.getElementById('prod-stock').value)
            });
            localStorage.setItem('pos_productos', JSON.stringify(productos));
            document.getElementById('form-producto').reset();
            actualizarPantalla();
        });

        inputManual.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                procesarVenta(inputManual.value.trim());
                inputManual.value = '';
            }
        });

        function eliminarProducto(index) {
            productos.splice(index, 1);
            localStorage.setItem('pos_productos', JSON.stringify(productos));
            actualizarPantalla();
        }

        buscador.addEventListener('input', actualizarPantalla);
        actualizarPantalla();
    </script>
</body>
</html>
